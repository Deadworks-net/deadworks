[package]
name = "deadworks-launcher"
version = "0.5.0"
description = "Deadworks Launcher"
authors = ["Deadworks"]
edition = "2021"

[lib]
name = "deadworks_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
tauri-plugin-store = "2.4.2"
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
futures-util = "0.3"
bzip2 = "0.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Loopback bridge for the in-game browser (src/local_api.rs): a blocking HTTP
# server on its own thread, plus what it takes to synthesise a PNG of an exact
# size. flate2/crc32fast are already in the tree via other dependencies.
tiny_http = "0.12"
flate2 = "1"
crc32fast = "1"
# Local server hosting (src/hosting): release/.NET/plugin archives, and the
# SHA1s Steam's depot manifests carry for every shipped file.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"

[dev-dependencies]
# Decodes the PNGs local_api synthesises, so the tests check them with a real
# decoder rather than only re-reading our own byte layout. Already in the tree
# (tauri pulls it for tray icons), so this costs no extra build.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# SteamCMD runs under a pseudo console: with its stdout on a pipe it buffers
# its prompts ("password:", "Steam Guard code:") and waits forever.
portable-pty = "0.9"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
] }

# Free disk space (statvfs) for the hosting setup screen on Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
