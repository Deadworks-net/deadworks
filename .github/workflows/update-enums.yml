name: Update Enums

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-enums:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run update script
        run: python scripts/update-enums.py --report "$RUNNER_TEMP/enums.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update game enums from the latest build"
          title: "chore: update game enums from the latest build"
          body-path: ${{ runner.temp }}/enums.md
          branch: chore/update-enums
          delete-branch: true
